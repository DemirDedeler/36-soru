/* Layout: one phone on a restaurant table. A cream card on soft blush, deep wine type; the rose-red card back is the one bold note. */
:root {
  --bg: #f8dcd5;
  --ink: #4a1622;
  --mute: #7d4552;
  --rose: #b8364c;
  --wine: #6b1d2e;
  --card: #fffaf7;
  --card-mute: #8f6064;
  --line: rgba(74,22,34,.14);
  --display: "DM Serif Display", Georgia, "Times New Roman", serif;
  --body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { min-height: 100%; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--bg); }
[hidden] { display: none !important; }
body {
  margin: 0;
  position: relative;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
/* Üstte yumuşak bir ışık: düz zemine doğru eriyerek kaybolur, böylece hiçbir ekran boyunda çizgi oluşmaz. */
body::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 75vh; pointer-events: none; background: radial-gradient(120% 90% at 50% 0%, #fdeee9 0%, rgba(253,238,233,0) 70%); }
.app {
  position: relative;
  max-width: 460px;
  min-height: 100vh;
  min-height: calc(100svh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  margin: 0 auto;
  padding-inline: 18px;
  padding-block: 20px 28px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.screen { display: flex; flex-direction: column; gap: 18px; flex: 1; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; line-height: 1.1; }
h1 { font-size: clamp(60px, 19vw, 88px); letter-spacing: -.01em; }
h1 em, h2 em { color: var(--rose); font-style: italic; }
h2 { font-size: 34px; }
p { margin: 0; }
.lede { color: var(--mute); font-size: 17px; max-width: 34ch; }
.eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--rose); font-weight: 700; }
.meta { color: var(--mute); font-size: 13px; text-align: center; }

.btn {
  appearance: none; border: 0; cursor: pointer;
  font: 700 16px/1 var(--body);
  padding: 18px 20px; border-radius: 14px;
  background: var(--wine); color: #fff4f1;
  box-shadow: 0 10px 24px -14px rgba(107,29,46,.7);
  transition: transform .12s ease, opacity .2s;
}
.btn:active { transform: scale(.98); }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.btn.small { padding: 12px 14px; font-size: 14px; border-radius: 12px; }
.btn[disabled] { opacity: .35; cursor: default; }
.link { background: none; border: 0; color: var(--mute); font: 500 14px var(--body); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 6px 0; }
.chip { appearance: none; border: 0; background: rgba(255,255,255,.35); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); border-radius: 10px; padding: 8px 11px; font: 500 13px var(--body); cursor: pointer; }
.chip[aria-pressed="true"] { color: var(--rose); box-shadow: inset 0 0 0 1.5px var(--rose); }
.btn:focus-visible, .chip:focus-visible, .link:focus-visible, .card:focus-visible, .qrow:focus-visible, .couple input:focus-visible, summary:focus-visible { outline: 2px solid var(--rose); outline-offset: 3px; }
.spacer { flex: 1; }
.stack { display: grid; gap: 10px; width: 100%; }
.links { display: flex; justify-content: center; gap: 28px; flex-wrap: wrap; }
.credit { color: var(--mute); font-size: 12px; line-height: 1.5; }

/* start */
.hero { display: flex; flex-direction: column; gap: 18px; padding-top: 6vh; }
.fan { position: relative; height: 150px; margin: 4px 0 6px; }
.fan i { position: absolute; left: 50%; top: 8px; width: 92px; height: 128px; margin-left: -46px; border-radius: 12px; box-shadow: 0 14px 28px -16px rgba(107,29,46,.55); }
.fan i:nth-child(1) { background: var(--rose); transform: rotate(-14deg) translateX(-48px); }
.fan i:nth-child(2) { background: var(--card); transform: translateY(-6px); z-index: 2; }
.fan i:nth-child(3) { background: var(--wine); transform: rotate(14deg) translateX(48px); }
.fan i:nth-child(2)::after { content: "36"; position: absolute; inset: 0; display: grid; place-items: center; font: italic 400 38px var(--display); color: var(--rose); }
.faq { display: grid; gap: 4px; padding-top: 34px; }
.faq h2 { font-size: 28px; margin-bottom: 8px; }
details { border-top: 1px solid var(--line); }
details:last-of-type { border-bottom: 1px solid var(--line); }
summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 16px 2px; font-weight: 700; font-size: 15.5px; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "+"; flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.5); color: var(--rose); font-size: 18px; font-weight: 500; transition: transform .2s ease; }
details[open] summary::after { transform: rotate(45deg); }
details p { padding: 0 2px 18px; color: var(--mute); font-size: 15px; max-width: 60ch; }
.foot { display: grid; gap: 6px; padding-top: 8px; }
details.privacy { border: 0; }
.privacy summary { justify-content: flex-start; font-size: 13px; font-weight: 500; color: var(--mute); padding: 6px 0; }
.privacy summary::after { width: 22px; height: 22px; font-size: 14px; }
.privacy p { font-size: 13px; padding-bottom: 8px; }

/* intro */
.steps { display: grid; gap: 14px; padding: 0; margin: 0; list-style: none; }
.steps li { display: grid; grid-template-columns: 52px 1fr; gap: 14px; align-items: center; font-size: 15.5px; }
.steps svg { width: 52px; height: 52px; padding: 10px; border-radius: 16px; background: rgba(255,255,255,.55); color: var(--rose); }
.couple { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.couple input {
  width: 100%; min-width: 0;
  background: rgba(255,255,255,.6); color: var(--ink);
  border: 1px solid var(--line); border-radius: 12px;
  padding: 14px; font: 500 16px var(--body); text-align: center;
}
.couple input::placeholder { color: var(--mute); opacity: .75; }
.amp { font: italic 400 38px/1 var(--display); color: var(--rose); padding-bottom: 4px; }

.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.progress { height: 3px; background: var(--line); border-radius: 3px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--rose); width: 0; transition: width .4s ease; }

/* card */
.table { flex: 1; display: grid; place-items: center; perspective: 1400px; min-height: 0; }
.card {
  position: relative; width: min(100%, 360px, calc((100svh - 250px) * 5 / 7)); min-width: 240px; aspect-ratio: 5 / 7;
  transform-style: preserve-3d; transition: transform .6s cubic-bezier(.2,.8,.2,1);
  cursor: pointer; border-radius: 22px; container-type: inline-size;
}
.card.flipped { transform: rotateY(180deg); }
.card.turned { transform: rotateZ(180deg); }
.card.flipped.turned { transform: rotateY(180deg) rotateZ(180deg); }
.card.enter { animation: deal .45s cubic-bezier(.2,.8,.2,1); }
@keyframes deal { from { transform: translateY(28px) rotate(-3deg); opacity: 0; } to { transform: none; opacity: 1; } }
.face {
  position: absolute; inset: 0; border-radius: 22px; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  box-shadow: 0 26px 50px -24px rgba(107,29,46,.55);
  display: flex; flex-direction: column;
}
.back {
  background:
    radial-gradient(circle at 50% 50%, rgba(255,240,236,.18) 0 22%, transparent 23%),
    repeating-linear-gradient(45deg, rgba(255,240,236,.16) 0 1.5px, transparent 1.5px 13px),
    repeating-linear-gradient(-45deg, rgba(255,240,236,.16) 0 1.5px, transparent 1.5px 13px),
    var(--rose);
  border: 10px solid var(--card);
  align-items: center; justify-content: center; gap: 10px; padding: 24px; text-align: center;
}
.back .mark { font-family: var(--display); font-style: italic; font-size: 68px; color: var(--card); line-height: 1; }
.back .hint { color: var(--card); opacity: .9; font-size: 14px; }
.front {
  transform: rotateY(180deg);
  background: var(--card); color: var(--ink);
  padding: 22px 22px 20px; gap: 14px;
}
.front .top { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--card-mute); font-weight: 700; }
.front .num { font-family: var(--display); font-style: italic; font-size: 32px; letter-spacing: 0; color: var(--rose); text-transform: none; font-weight: 400; }
.front .q { font-family: var(--display); font-size: clamp(22px, 6.4vw, 27px); font-size: clamp(16px, 7.4cqi, 27px); line-height: 1.22; flex: 1; display: flex; align-items: center; text-wrap: pretty; overflow-wrap: anywhere; min-height: 0; }
.front .q.long { font-size: clamp(18px, 5vw, 23px); font-size: clamp(14px, 5.9cqi, 23px); }
.front .note { font-size: 13.5px; line-height: 1.4; color: var(--card-mute); font-style: italic; }
.front .who { font-size: 14px; color: var(--card-mute); border-top: 1px solid var(--line); padding-top: 12px; }
.front .who b { color: var(--ink); }
.front .timer-row { display: flex; align-items: center; gap: 10px; }
.front .clock { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 18px; }

.controls { display: grid; grid-template-columns: auto 1fr 1fr; gap: 10px; }
.toast { text-align: center; color: var(--mute); font-size: 13px; min-height: 20px; }

.level-num { font-family: var(--display); font-style: italic; font-size: 120px; line-height: .9; color: var(--rose); }
.center { text-align: center; align-items: center; }

/* question menu */
.menu-head .title { display: flex; align-items: center; gap: 10px; min-width: 0; }
.icon-btn { appearance: none; border: 0; cursor: pointer; flex: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: rgba(255,255,255,.5); color: var(--rose); box-shadow: inset 0 0 0 1px var(--line); }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn:focus-visible { outline: 2px solid var(--rose); outline-offset: 3px; }
.menu-head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; padding: 10px 18px; margin: -10px -18px; background: var(--bg); box-shadow: 0 10px 20px -12px var(--bg); }
.grp { display: grid; gap: 10px; }
.qlist { display: grid; gap: 8px; }
.qrow {
  appearance: none; border: 0; cursor: pointer; text-align: left; color: var(--ink);
  display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: start;
  padding: 13px 14px; border-radius: 14px; background: rgba(255,255,255,.5); box-shadow: inset 0 0 0 1px var(--line);
  font: 400 15px/1.4 var(--body);
}
.qrow .qn { font-family: var(--display); font-style: italic; font-size: 20px; line-height: 1.05; color: var(--rose); }
.qrow .qt { min-width: 0; }
.qrow.seen .qt { opacity: .5; }
.qrow.cur { box-shadow: inset 0 0 0 1.5px var(--rose); background: rgba(255,255,255,.8); }
.tag { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); padding-top: 3px; }
.tag.pass { color: var(--rose); }

/* eye contact */
.ring { position: relative; width: min(260px, 70vw); aspect-ratio: 1; margin: 0 auto; color: var(--rose); }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .t { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: 56px; font-variant-numeric: tabular-nums; color: var(--ink); }

@media (prefers-reduced-motion: reduce) {
  .card, .progress i, summary::after { transition: none; }
  .card.enter { animation: none; }
}
</style>

// Ziyaretçi sayacı (GoatCounter). Hesap kodunu buraya yazın, örn. "36soru". Boşsa sayaç çalışmaz.

}
function deck(l) { return l === 3 ? S.passRound : Array.from({ length: 12 }, (_, i) => l * 12 + i); }
function cur() { return deck(S.level)[S.pos]; }
function save() { try { localStorage.setItem(KEY, JSON.stringify({ ...S, timer: null })); } catch (e) {} }
function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); return s && s.screen ? s : null; } catch (e) { return null; } }
function clear() { try { localStorage.removeItem(KEY); } catch (e) {} }
function name(i) { return (S.names[i] || "").trim() || (i === 0 ? "1. kişi" : "2. kişi"); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }
function fmt(s) { const m = Math.floor(s / 60), r = s % 60; return m + ":" + String(r).padStart(2, "0"); }
function track(path, title) { try { window.goatcounter?.count?.({ path, title, event: true }); } catch (e) {} }
function loadCounter() {

  const sc = document.createElement("script");

}

// Bitiş ekranında yukarıdan yağan konfeti. Hareketi azaltma ayarı açık olan telefonlarda çalışmaz.
let lastScreen = "";
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.createElement("canvas");
  c.style.cssText = "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50";
  document.body.appendChild(c);
  const x = c.getContext("2d"), dpr = Math.min(devicePixelRatio || 1, 2);
  const W = innerWidth, H = innerHeight; c.width = W * dpr; c.height = H * dpr; x.scale(dpr, dpr);
  const colors = ["#b8364c", "#6b1d2e", "#e88a9a", "#f4b8c1", "#fffaf7", "#d9a35b"];
  const bits = Array.from({ length: 150 }, () => ({
    x: Math.random() * W, y: -20 - Math.random() * H * 0.8,
    w: 6 + Math.random() * 5, h: 9 + Math.random() * 7,
    vy: 110 + Math.random() * 120, sway: 20 + Math.random() * 40, phase: Math.random() * 6.3,
    rot: Math.random() * 6.3, spin: (Math.random() - .5) * 8,
    color: colors[Math.floor(Math.random() * colors.length)], round: Math.random() < .3
  }));
  const LIFE = 5.5; let t0 = null, prev = 0;
  function frame(now) {
    if (t0 === null) { t0 = prev = now; }
    const t = (now - t0) / 1000, dt = Math.min((now - prev) / 1000, .05); prev = now;
    x.clearRect(0, 0, W, H);
    x.globalAlpha = t > LIFE - 1 ? Math.max(0, LIFE - t) : 1;
    for (const b of bits) {
      b.y += b.vy * dt; b.rot += b.spin * dt;
      const bx = b.x + Math.sin(t * 2 + b.phase) * b.sway;
      x.save(); x.translate(bx, b.y); x.rotate(b.rot); x.scale(1, Math.cos(t * 4 + b.phase));
      x.fillStyle = b.color;
      if (b.round) { x.beginPath(); x.arc(0, 0, b.w / 2, 0, 6.3); x.fill(); }
      else x.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
      x.restore();
    }
    if (t < LIFE && c.isConnected) requestAnimationFrame(frame); else c.remove();
  }
  requestAnimationFrame(frame);
}

function startTimer(seconds, onTick, onDone) {
  stopTimer();
  const left = S.timer ? S.timer.left : seconds;
  S.timer = { left, end: Date.now() + left * 1000 };
  tick = setInterval(() => {
    S.timer.left = Math.max(0, Math.round((S.timer.end - Date.now()) / 1000));
    onTick(S.timer.left);
    if (S.timer.left <= 0) { stopTimer(); S.timer = null; onDone(); }
  }, 250);
}
function stopTimer() { if (tick) clearInterval(tick); tick = null; }
function pauseTimer() { stopTimer(); if (S.timer) S.timer = { left: S.timer.left }; }
// Telefonun paylaş menüsünü açar; desteklemeyen tarayıcıda linki panoya kopyalar.
async function share(btn) {
  const url = document.querySelector('meta[property="og:url"]')?.content || location.href;
  const data = { title: "36 Soru", text: "İlk buluşmada tek telefonla oynanan 36 soruluk kart oyunu.", url };
  track("paylas", "Link paylaşıldı");
  if (navigator.share) {
    try { await navigator.share(data); return; } catch (e) { if (e.name === "AbortError") return; }
  }
  try { await navigator.clipboard.writeText(url); }
  catch (e) {
    const ta = document.createElement("textarea"); ta.value = url; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e2) {} ta.remove();
  }
  btn.textContent = "Link kopyalandı";
  setTimeout(() => { if (btn.isConnected) btn.textContent = "Linki paylaş"; }, 2000);
}
function buzz() { try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {} }

// Bir sonraki karta, seviyeye ya da pas geçilenler turuna geçer.
function step() {
  S.flipped = false; S.turned = false; S.timer = null; S.reads = (S.reads || 0) + 1;
  if (S.pos < deck(S.level).length - 1) { S.pos++; go("play"); }
  else if (S.level < 2) { S.level++; S.pos = 0; go("level"); }
  else if (S.level === 2 && S.passed.length) { S.passRound = [...S.passed]; S.level = 3; S.pos = 0; go("level"); }
  else { if (!S.eyeReady) track("sorular-bitti", "36 soru bitti"); S.eyeReady = true; go("eye"); }
}

function act(a, el) {
  if (a === "intro") { stopTimer(); S.screen = "intro"; render(); window.scrollTo(0, 0); }
  else if (a === "ready") {
    const n = [document.getElementById("n0")?.value || "", document.getElementById("n1")?.value || ""];
    S = fresh(); S.names = n;
    keepAwake(); track("oyun-basladi", "Oyun başladı"); go("level");
  } else if (a === "resume") {
    S = { ...fresh(), ...load(), timer: null }; keepAwake(); render();
  } else if (a === "home") { stopTimer(); S.screen = "start"; render(); window.scrollTo(0, 0); }
  else if (a === "begin") { S.pos = 0; S.flipped = false; go("play"); }
  // Çevirme ve açma, kartı yeniden çizmeden yerinde yapılır; böylece animasyon kesilmeden akar.
  else if (a === "turn") {
    S.turned = !S.turned; save();
    const card = document.getElementById("card");
    if (card) { card.classList.remove("enter"); card.classList.toggle("turned", S.turned); }
    el.setAttribute("aria-pressed", S.turned ? "true" : "false");
  } else if (a === "flip") {
    if (S.flipped) return;
    S.flipped = true; const q = cur(); if (!S.seen.includes(q)) S.seen.push(q); save();
    const card = document.getElementById("card");
    card.classList.remove("enter"); card.classList.add("flipped"); card.setAttribute("aria-label", "Soru kartı");
    app.querySelectorAll('[data-a="pass"], [data-a="next"]').forEach(b => b.disabled = false);
    const t = document.getElementById("toast"); if (t && S.level !== 3 && !S.eyeReady) t.textContent = "";
    const bar = app.querySelector(".progress i"); if (bar) bar.style.width = (S.seen.length / 36 * 100) + "%";
  } else if (a === "next") { drop(S.passed, cur()); step(); }
  else if (a === "pass") {
    if (S.level < 3) { const q = cur(); if (!S.passed.includes(q)) S.passed.push(q); flash = "Bu kartı en sona sakladık."; }
    else { drop(S.passed, cur()); }
    step();
  } else if (a === "back") {
    S.timer = null;
    if (S.pos > 0) S.pos--;
    else if (S.level > 0) { S.level--; S.pos = deck(S.level).length - 1; }
    S.reads = Math.max(0, (S.reads || 0) - 1); S.turned = false; S.flipped = true; go("play");
  } else if (a === "menu") {
    stopTimer(); S.timer = null; S.prev = S.screen; S.screen = "menu"; render(); window.scrollTo(0, 0);
  } else if (a === "close") { go(S.prev || "play"); window.scrollTo(0, 0); }
  else if (a === "jump") {
    const q = +el.dataset.q;
    S.level = Math.floor(q / 12); S.pos = q % 12; S.flipped = false; S.turned = false; S.reads = (S.reads || 0) + 1;
    go("play"); window.scrollTo(0, 0);
  } else if (a === "timer") {
    if (tick) { pauseTimer(); render(); }
    else {
      startTimer(TIMED[cur()], l => { const c = document.getElementById("clock"); if (c) c.textContent = fmt(l); },
        () => { buzz(); flash = "Süre bitti, sıra diğerinde."; render(); });
      render();
    }
  } else if (a === "eye") {
    if (tick) { pauseTimer(); render(); }
    else {
      const C = 2 * Math.PI * 46;
      startTimer(EYE_SECONDS, l => {
        const c = document.getElementById("clock"); if (c) c.textContent = fmt(l);
        const arc = document.getElementById("arc"); if (arc) arc.setAttribute("stroke-dashoffset", C * (1 - l / EYE_SECONDS));
      }, () => { buzz(); track("goz-temasi-bitti", "Göz teması bitti"); go("end"); });
      render();
    }
  } else if (a === "finish") { S.timer = null; go("end"); }
  // Pas turunda kalan kartları atlayıp doğrudan göz teması ekranına geçer.
  else if (a === "skipall") { S.level = 3; S.pos = deck(3).length - 1; step(); }
  else if (a === "share") { share(el); }
  // Sorulara geri dönenler, göz temasına her ekrandan tek dokunuşla geri gelebilir.
  else if (a === "toeye") { S.flipped = false; S.turned = false; S.timer = null; go("eye"); window.scrollTo(0, 0); }
  else if (a === "restart") { const n = S.names; clear(); S = fresh(); S.names = n; render(); }
}

function bind() {
  app.querySelectorAll("[data-a]").forEach(b => b.addEventListener("click", e => { e.stopPropagation(); act(b.dataset.a, b); }));
  const card = document.getElementById("card");
  if (card) {
    card.addEventListener("click", () => act("flip"));
    card.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); act("flip"); } });
  }
  ["n0", "n1"].forEach((id, i) => { const el = document.getElementById(id); if (el) el.addEventListener("input", () => { S.names[i] = el.value; }); });
}

render();
loadCounter();
</script>
